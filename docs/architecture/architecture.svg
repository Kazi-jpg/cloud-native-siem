<text x="48" y="98" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0f172a" font-weight="700">From suspicious indicator to searchable security event</text>
<text x="48" y="135" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" font-weight="400">VirusTotal enrichment  /  event-driven ingestion  /  BigQuery investigation</text>
