<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Cloud Native SIEM architecture</title><desc id="desc">A local Python console enriches indicators with VirusTotal, saves events and alerts locally, and publishes events to Google Cloud Pub/Sub. A separate local Python worker pulls messages and writes to BigQuery. SQL supports investigation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1600" height="1120" fill="#f8fafc"/>
